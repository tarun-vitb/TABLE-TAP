<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}TableTap — QR Restaurant Ordering{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>input,select,textarea{width:100%;padding:.4rem;border:1px solid #ccc;border-radius:.4rem} .card{margin-bottom:1rem}</style>
</head><body><nav class="navbar navbar-dark bg-dark"><div class="container">
<a class="navbar-brand" href="/">🍽️ TableTap</a>
<span class="text-light small">{% if user.is_authenticated %}{{ user.username }} · <a class="text-light" href="/dashboard/">Dashboard</a> · <a class="text-light" href="/logout/">Logout</a>{% else %}<a class="text-light" href="/login/">Owner login</a>{% endif %}</span>
</div></nav><div class="container py-4">
{% if messages %}{% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}{% endif %}
{% block content %}{% endblock %}</div></body></html>
